name: Auto Patch WPS Office PC APK

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Masukkan Link atau File ID Google Drive APK WPS PC'
        required: true
        type: string

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install APKTool, gdown, & Uber-APK-Signer
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl python3-pip zipalign
          pip3 install --upgrade gdown
          
          # Unduh APKTool
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool apktool.jar
          sudo mv apktool apktool.jar /usr/local/bin/
          
          # Unduh Uber APK Signer
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: 4. Download APK dari Google Drive
        run: |
          echo "Mengunduh file besar dari Google Drive..."
          # Parameter --fuzzy dan --continue untuk menangani konfirmasi limit file besar
          python3 -m gdown --fuzzy "${{ github.event.inputs.gdrive_url }}" -O wps_ori.apk --continue
          ls -lh wps_ori.apk

      - name: 5. Decompile & Patch APK
        run: |
          echo "Membongkar struktur APK..."
          apktool d wps_ori.apk -o decompiled_apk -f

          MANIFEST="decompiled_apk/AndroidManifest.xml"
          
          echo "Memodifikasi AndroidManifest.xml..."
          sed -i 's/android:required="true"/android:required="false"/g' "$MANIFEST"
          sed -i '/com.xiaomi.permission/d' "$MANIFEST"
          sed -i '/miui.permission/d' "$MANIFEST"

          echo "Melakukan Patching Smali..."
          MATCHED_FILES=$(grep -rl "isSupportPc\|isMiuiPc\|ro.miui.ui.version\|checkDevice" decompiled_apk/smali* || true)
          
          if [ -n "$MATCHED_FILES" ]; then
            for file in $MATCHED_FILES; do
              echo "Memodifikasi: $file"
              sed -i 's/const\/4 v0, 0x0/const\/4 v0, 0x1/g' "$file"
              sed -i 's/const\/4 v1, 0x0/const\/4 v1, 0x1/g' "$file"
            done
          fi

      - name: 6. Recompile & Sign APK
        run: |
          echo "Menyusun ulang APK..."
          apktool b decompiled_apk -o wps_patched_unsigned.apk --use-aapt2

          echo "Menandatangani APK..."
          java -jar signer.jar --apks wps_patched_unsigned.apk --out signed_output
          ls -lh signed_output/

      - name: 7. Upload Hasil APK Matang
        uses: actions/upload-artifact@v4
        with:
          name: WPS-Office-PC-Patched-APK
          path: signed_output/*.apk
          retention-days: 5
