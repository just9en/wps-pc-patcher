name: Auto Patch WPS Office PC APK

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Masukkan Link atau File ID Google Drive APK WPS PC'
        required: true
        type: string

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install APKTool, gdown, & Uber-APK-Signer
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl python3-pip zipalign
          pip3 install gdown
          
          # Download APKTool versi terbaru
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool apktool.jar
          sudo mv apktool apktool.jar /usr/local/bin/
          
          # Download Uber APK Signer untuk Sign & Zipalign otomatis
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: 4. Download APK dari Google Drive
        run: |
          echo "Mengunduh APK dari Google Drive..."
          gdown --fuzzy "${{ github.event.inputs.gdrive_url }}" -O wps_ori.apk
          ls -lh wps_ori.apk

      - name: 5. Decompile & Patch APK (Manifest + Smali)
        run: |
          echo "Membongkar APK (Tanpa mendekode aset Linux agar cepat dan tidak korup)..."
          # Flag --only-main-classes mencegah error pada aset image Linux berukuran besar
          apktool d wps_ori.apk -o decompiled_apk -f

          MANIFEST="decompiled_apk/AndroidManifest.xml"
          
          echo "Memodifikasi AndroidManifest.xml..."
          # 1. Mengubah semua uses-library wajib (seperti miui.pc.framework) menjadi tidak wajib (false)
          sed -i 's/android:required="true"/android:required="false"/g' "$MANIFEST"
          
          # 2. Memastikan aplikasi bisa diinstal di memori eksternal/internal secara fleksibel & mengizinkan debug
          sed -i '/com.xiaomi.permission/d' "$MANIFEST"
          sed -i '/miui.permission/d' "$MANIFEST"

          echo "Melakukan Patching Smali (Bypass pengecekan ROM & Device Xiaomi)..."
          # Mencari file smali yang memvalidasi PC Framework / MIUI / HyperOS
          MATCHED_FILES=$(grep -rl "isSupportPc\|isMiuiPc\|ro.miui.ui.version\|checkDevice" decompiled_apk/smali* || true)
          
          if [ -n "$MATCHED_FILES" ]; then
            for file in $MATCHED_FILES; do
              echo " -> Mem-patch file: $file"
              # Mengubah return boolean false (0x0) menjadi true (0x1)
              sed -i 's/const\/4 v0, 0x0/const\/4 v0, 0x1/g' "$file"
              sed -i 's/const\/4 v1, 0x0/const\/4 v1, 0x1/g' "$file"
            done
          else
            echo "Catatan: String spesifik tidak ditemukan di smali utama, melanjutkan dengan patch Manifest."
          fi

      - name: 6. Recompile & Sign APK
        run: |
          echo "Menyusun ulang (Recompile) APK..."
          apktool b decompiled_apk -o wps_patched_unsigned.apk --use-aapt2

          echo "Melakukan Zipalign dan Signing APK..."
          java -jar signer.jar --apks wps_patched_unsigned.apk --out signed_output
          
          ls -lh signed_output/

      - name: 7. Upload Hasil APK Matang ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WPS-Office-PC-Patched-APK
          path: signed_output/*.apk
          retention-days: 5
